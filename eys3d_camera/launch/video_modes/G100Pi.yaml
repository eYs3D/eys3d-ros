  # === USB 2.0 L'+R' wide 1280x720 ===
  75:
    name: "L'+R' 1280(x2)x720@2 (USB 2.0)"
    usb: 2
    color: {w: 2560, h: 720, fmt: 0, split_lr: true}
    depth: {w: 0, h: 0, dtype: 5}
    zd_index: 0
    fps: 2
    interleave: false

  # === L+R wide ===
  80:
    name: "L+R 1280(x2)x720@30"
    usb: 3
    color: {w: 2560, h: 720, fmt: 0, split_lr: true}
    depth: {w: 0, h: 0, dtype: 0}
    zd_index: 0
    fps: 30
    interleave: false
